<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Access denied">
	<title>403 | Access Forbidden</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="error-pages.css">
</head>
<body>
	<main class="error-shell" aria-labelledby="error-title">
		<section class="error-card">
			<p class="error-code" aria-hidden="true">403</p>
			<h1 id="error-title">Access to this area is restricted</h1>
			<p class="error-copy">
				You are authenticated, but your account does not have permission to view this resource.
			</p>

			<div class="error-actions">
				<a class="btn btn-primary" href="/">Back to Home</a>
				<a class="btn btn-secondary" href="/login">Sign in with another account</a>
			</div>

			<p class="error-meta">
				If you believe this is a mistake, contact support at webstean@gmail.com.
			</p>
		</section>
	</main>
</body>
</html>
