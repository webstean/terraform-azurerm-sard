<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Page not found">
	<title>404 | Page Not Found</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="error-pages.css">
</head>
<body>
	<main class="error-shell" aria-labelledby="error-title">
		<section class="error-card">
			<p class="error-code" aria-hidden="true">404</p>
			<h1 id="error-title">This path drifted into deep space</h1>
			<p class="error-copy">
				The page you requested does not exist, may have moved, or is temporarily unavailable.
			</p>

			<div class="error-actions">
				<a class="btn btn-primary" href="/">Take Me Home</a>
				<a class="btn btn-secondary" href="mailto:webstean@gmail.com">Contact Support</a>
			</div>

			<p class="error-meta">
				If you typed the address manually, check the URL and try again.
			</p>
		</section>
	</main>
</body>
</html>
